  <circle cx="200" cy="230" r="32" fill="#003d6b" stroke="#ffffff" stroke-width="4" />
  <path d="M 194 240 C 191 240 188 238 188 234 C 188 230 191 228 194 228 C 196 228 198 229 199 230 L 199 216 L 212 212 L 212 226 C 210 225 208 224 206 224 C 202 224 200 227 200 230 C 200 234 202 236 206 236 C 210 236 212 233 212 230 L 212 210 L 197 214 L 197 232 C 196 231 195 231 194 231 Z" fill="#38bdf8" />

  <!-- Data pixels around -->
  <rect x="145" y="275" width="20" height="20" fill="#0f172a" />
  <rect x="185" y="285" width="15" height="15" fill="#0f172a" />
  <rect x="220" y="275" width="25" height="10" fill="#0f172a" />
  <rect x="260" y="280" width="10" height="20" fill="#0f172a" />
  <rect x="290" y="275" width="25" height="25" fill="#0f172a" />

