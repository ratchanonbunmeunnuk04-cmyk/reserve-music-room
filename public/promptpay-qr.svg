<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003d6b" />
      <stop offset="100%" stop-color="#005ea6" />
    </linearGradient>
    <pattern id="qrPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0f172a" />
      <rect x="8" y="8" width="8" height="8" fill="#0f172a" />
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="24" fill="#ffffff" />

  <!-- PromptPay Header Banner -->
  <path d="M 0 24 Q 0 0 24 0 L 376 0 Q 400 0 400 24 L 400 80 L 0 80 Z" fill="url(#headerGrad)" />
  <text x="200" y="48" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">PROMPTPAY</text>
  <text x="200" y="68" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#93c5fd" text-anchor="middle">พร้อมเพย์ • ชมรมดนตรีสากล ม.ศิลปากร</text>

  <!-- QR Frame Outer -->
  <rect x="40" y="100" width="320" height="260" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- QR Position Detection Patterns (Top Left, Top Right, Bottom Left) -->
  <!-- Top-Left Finder Pattern -->
  <rect x="65" y="125" width="60" height="60" rx="8" fill="#0f172a" />
  <rect x="75" y="135" width="40" height="40" rx="4" fill="#ffffff" />
  <rect x="83" y="143" width="24" height="24" rx="2" fill="#0f172a" />

  <!-- Top-Right Finder Pattern -->
  <rect x="275" y="125" width="60" height="60" rx="8" fill="#0f172a" />
  <rect x="285" y="135" width="40" height="40" rx="4" fill="#ffffff" />
  <rect x="293" y="143" width="24" height="24" rx="2" fill="#0f172a" />

  <!-- Bottom-Left Finder Pattern -->
  <rect x="65" y="275" width="60" height="60" rx="8" fill="#0f172a" />
  <rect x="75" y="285" width="40" height="40" rx="4" fill="#ffffff" />
  <rect x="83" y="293" width="24" height="24" rx="2" fill="#0f172a" />

  <!-- Simulated QR Data Matrix -->
  <!-- Center elements -->
  <rect x="145" y="125" width="10" height="20" fill="#0f172a" />
  <rect x="175" y="125" width="30" height="10" fill="#0f172a" />
  <rect x="225" y="125" width="20" height="20" fill="#0f172a" />

  <rect x="145" y="160" width="40" height="10" fill="#0f172a" />
  <rect x="205" y="150" width="15" height="25" fill="#0f172a" />
  <rect x="240" y="165" width="15" height="15" fill="#0f172a" />

