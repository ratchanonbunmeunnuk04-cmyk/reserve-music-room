  <rect x="310" y="225" width="15" height="25" fill="#0f172a" />
  <rect x="145" y="210" width="10" height="30" fill="#0f172a" />
  <rect x="80" y="215" width="30" height="10" fill="#0f172a" />

  <text x="200" y="380" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1">SCAN WITH ANY BANKING APP</text>
